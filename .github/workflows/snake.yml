# Draws the profile's live cards daily and on demand: contribution snake, GitHub stats and top languages
# (navy and gold), published to the `output` branch. No outside card services are needed.
name: Profile cards
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Stats and languages
        run: python scripts/make_stats.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#C9A227&color_dots=#0E2547,#1E3A6E,#5B7DB1,#A8892A,#F2D372
            dist/snake-light.svg?color_snake=#0B1F3A&color_dots=#EBEDF0,#F2E3A6,#E3C35A,#C9A227,#8C6D12
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
