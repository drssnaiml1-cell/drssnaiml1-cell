<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="382" viewBox="0 0 1200 382" role="img" aria-label="AlgoLang features: agents not functions, confidence built in, safe by compilation, real-time events, trustworthy AI, fairness tests, signed accountability, ready at scale">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1F3A"/><stop offset="1" stop-color="#16305A"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9A227"/><stop offset="1" stop-color="#F2D372"/></linearGradient></defs>
<style>.h{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#C9A227;letter-spacing:3px}.t{font:700 17px "Segoe UI",Helvetica,Arial,sans-serif;fill:#FFFFFF}.d{font:400 13.5px "Segoe UI",Helvetica,Arial,sans-serif;fill:#B9C3D6}.n{font:800 15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#0B1F3A}.c{animation:up .6s ease-out backwards}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.gl{animation:gl 4s ease-in-out infinite}@keyframes gl{0%,100%{stroke-opacity:.3}50%{stroke-opacity:1}}</style>
<rect width="1200" height="382" rx="18" fill="url(#bg)"/><rect width="1200" height="4" fill="url(#g)"/>
<text x="600" y="42" class="h" text-anchor="middle">WHAT MAKES ALGOLANG DIFFERENT</text>

<g class="c" style="animation-delay:0.0s"><rect x="24.0" y="62" width="274.5" height="132" rx="14" fill="#0E2547" stroke="#C9A227" stroke-width="1.4" class="gl" style="animation-delay:0.0s"/><circle cx="54.0" cy="94" r="15" fill="url(#g)"/><text x="54.0" y="99" text-anchor="middle" class="n">1</text><text x="78.0" y="100" class="t">Agents, not functions</text><text x="44.0" y="138" class="d">Every unit of work is an agent</text><text x="44.0" y="160" class="d">with a role, goal, tools and policy.</text></g>
<g class="c" style="animation-delay:0.1s"><rect x="316.5" y="62" width="274.5" height="132" rx="14" fill="#0E2547" stroke="#C9A227" stroke-width="1.4" class="gl" style="animation-delay:0.5s"/><circle cx="346.5" cy="94" r="15" fill="url(#g)"/><text x="346.5" y="99" text-anchor="middle" class="n">2</text><text x="370.5" y="100" class="t">Confidence built in</text><text x="336.5" y="138" class="d">uncertain&lt;T&gt; results carry a</text><text x="336.5" y="160" class="d">confidence that flows can branch on.</text></g>
<g class="c" style="animation-delay:0.2s"><rect x="609.0" y="62" width="274.5" height="132" rx="14" fill="#0E2547" stroke="#C9A227" stroke-width="1.4" class="gl" style="animation-delay:1.0s"/><circle cx="639.0" cy="94" r="15" fill="url(#g)"/><text x="639.0" y="99" text-anchor="middle" class="n">3</text><text x="663.0" y="100" class="t">Safe by compilation</text><text x="629.0" y="138" class="d">31 compile-time rules stop unsafe</text><text x="629.0" y="160" class="d">programs before they ever run.</text></g>
<g class="c" style="animation-delay:0.3s"><rect x="901.5" y="62" width="274.5" height="132" rx="14" fill="#0E2547" stroke="#C9A227" stroke-width="1.4" class="gl" style="animation-delay:1.5s"/><circle cx="931.5" cy="94" r="15" fill="url(#g)"/><text x="931.5" y="99" text-anchor="middle" class="n">4</text><text x="955.5" y="100" class="t">Real-time events</text><text x="921.5" y="138" class="d">AlgoPulse™ streams score events</text><text x="921.5" y="160" class="d">live, with alerts and dead letters.</text></g>
<g class="c" style="animation-delay:0.4s"><rect x="24.0" y="212" width="274.5" height="132" rx="14" fill="#0E2547" stroke="#C9A227" stroke-width="1.4" class="gl" style="animation-delay:2.0s"/><circle cx="54.0" cy="244" r="15" fill="url(#g)"/><text x="54.0" y="249" text-anchor="middle" class="n">5</text><text x="78.0" y="250" class="t">Trustworthy AI</text><text x="44.0" y="288" class="d">Risk levels, PII redaction and</text><text x="44.0" y="310" class="d">explanations backed by evidence.</text></g>
<g class="c" style="animation-delay:0.5s"><rect x="316.5" y="212" width="274.5" height="132" rx="14" fill="#0E2547" stroke="#C9A227" stroke-width="1.4" class="gl" style="animation-delay:2.5s"/><circle cx="346.5" cy="244" r="15" fill="url(#g)"/><text x="346.5" y="249" text-anchor="middle" class="n">6</text><text x="370.5" y="250" class="t">Tested for fairness</text><text x="336.5" y="288" class="d">eval blocks check fairness and</text><text x="336.5" y="310" class="d">robustness on every change.</text></g>
<g class="c" style="animation-delay:0.6s"><rect x="609.0" y="212" width="274.5" height="132" rx="14" fill="#0E2547" stroke="#C9A227" stroke-width="1.4" class="gl" style="animation-delay:3.0s"/><circle cx="639.0" cy="244" r="15" fill="url(#g)"/><text x="639.0" y="249" text-anchor="middle" class="n">7</text><text x="663.0" y="250" class="t">Signed accountability</text><text x="629.0" y="288" class="d">Ed25519-signed audit chains and</text><text x="629.0" y="310" class="d">AI system cards for every program.</text></g>
<g class="c" style="animation-delay:0.7s"><rect x="901.5" y="212" width="274.5" height="132" rx="14" fill="#0E2547" stroke="#C9A227" stroke-width="1.4" class="gl" style="animation-delay:3.5s"/><circle cx="931.5" cy="244" r="15" fill="url(#g)"/><text x="931.5" y="249" text-anchor="middle" class="n">8</text><text x="955.5" y="250" class="t">Ready at scale</text><text x="921.5" y="288" class="d">22 applications, 120 domain packs,</text><text x="921.5" y="310" class="d">quantum and LLM/SLM optimisation.</text></g>
</svg>