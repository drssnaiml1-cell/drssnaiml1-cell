<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Impact: 60+ publications, 11+ patents, 11 books, 56 scholars, 22 years, 22 AlgoLang applications">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1F3A"/><stop offset="1" stop-color="#16305A"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9A227"/><stop offset="1" stop-color="#F2D372"/></linearGradient></defs>
<style>.n{font:800 44px "Segoe UI",Helvetica,Arial,sans-serif;fill:url(#gold)}.t{font:700 16px "Segoe UI",Helvetica,Arial,sans-serif;fill:#FFFFFF}.s{font:400 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#B9C3D6}.h{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#C9A227;letter-spacing:3px}.c{animation:up .7s ease-out backwards}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.g{animation:glow 3.6s ease-in-out infinite}@keyframes glow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:1}}</style>
<rect width="1200" height="230" rx="18" fill="url(#bg)"/>
<rect x="0" y="0" width="1200" height="4" fill="url(#gold)"/>
<text x="600.0" y="38" text-anchor="middle" class="h">IMPACT AT A GLANCE</text>
<g class="c" style="animation-delay:0.00s"><rect x="32.0" y="58" width="176" height="148" rx="14" fill="#0E2547" stroke="#C9A227" stroke-width="1.5" class="g" style="animation-delay:0.0s"/><text x="120.0" y="118" text-anchor="middle" class="n">60+</text><text x="120.0" y="150" text-anchor="middle" class="t">Publications</text><text x="120.0" y="174" text-anchor="middle" class="s">SCI · Scopus · IEEE</text></g>
<g class="c" style="animation-delay:0.15s"><rect x="224.0" y="58" width="176" height="148" rx="14" fill="#0E2547" stroke="#C9A227" stroke-width="1.5" class="g" style="animation-delay:0.6s"/><text x="312.0" y="118" text-anchor="middle" class="n">11+</text><text x="312.0" y="150" text-anchor="middle" class="t">Patents</text><text x="312.0" y="174" text-anchor="middle" class="s">published</text></g>
<g class="c" style="animation-delay:0.30s"><rect x="416.0" y="58" width="176" height="148" rx="14" fill="#0E2547" stroke="#C9A227" stroke-width="1.5" class="g" style="animation-delay:1.2s"/><text x="504.0" y="118" text-anchor="middle" class="n">11</text><text x="504.0" y="150" text-anchor="middle" class="t">Books</text><text x="504.0" y="174" text-anchor="middle" class="s">authored</text></g>
<g class="c" style="animation-delay:0.45s"><rect x="608.0" y="58" width="176" height="148" rx="14" fill="#0E2547" stroke="#C9A227" stroke-width="1.5" class="g" style="animation-delay:1.8s"/><text x="696.0" y="118" text-anchor="middle" class="n">56</text><text x="696.0" y="150" text-anchor="middle" class="t">Scholars</text><text x="696.0" y="174" text-anchor="middle" class="s">Ph.D. &amp; postdoc</text></g>
<g class="c" style="animation-delay:0.60s"><rect x="800.0" y="58" width="176" height="148" rx="14" fill="#0E2547" stroke="#C9A227" stroke-width="1.5" class="g" style="animation-delay:2.4s"/><text x="888.0" y="118" text-anchor="middle" class="n">22</text><text x="888.0" y="150" text-anchor="middle" class="t">Years</text><text x="888.0" y="174" text-anchor="middle" class="s">teaching &amp; R&amp;D</text></g>
<g class="c" style="animation-delay:0.75s"><rect x="992.0" y="58" width="176" height="148" rx="14" fill="#0E2547" stroke="#C9A227" stroke-width="1.5" class="g" style="animation-delay:3.0s"/><text x="1080.0" y="118" text-anchor="middle" class="n">22</text><text x="1080.0" y="150" text-anchor="middle" class="t">AI apps</text><text x="1080.0" y="174" text-anchor="middle" class="s">built in AlgoLang</text></g>
</svg>