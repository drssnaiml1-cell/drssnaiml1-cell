<svg xmlns="http://www.w3.org/2000/svg" width="400" height="174" viewBox="0 0 400 174" role="img" aria-label="GitHub stats"><style>.h{font:700 18px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#C9A227}.l{font:400 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#E8ECF4}
.v{font:700 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#FFFFFF}.r{animation:in .6s ease-out backwards}
@keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}</style><rect width="400" height="174" rx="14" fill="#0B1F3A"/><rect width="400" height="3" fill="#C9A227"/><text x="24" y="38" class="h">GitHub stats</text><g class="r" style="animation-delay:0.0s"><circle cx="30" cy="68" r="4" fill="#C9A227"/><text x="44" y="73" class="l">Contributions (last year)</text><text x="376" y="73" class="v" text-anchor="end">50</text></g><g class="r" style="animation-delay:0.1s"><circle cx="30" cy="94" r="4" fill="#C9A227"/><text x="44" y="99" class="l">Commits (incl. private)</text><text x="376" y="99" class="v" text-anchor="end">46</text></g><g class="r" style="animation-delay:0.2s"><circle cx="30" cy="120" r="4" fill="#C9A227"/><text x="44" y="125" class="l">Public repositories</text><text x="376" y="125" class="v" text-anchor="end">4</text></g><g class="r" style="animation-delay:0.3s"><circle cx="30" cy="146" r="4" fill="#C9A227"/><text x="44" y="151" class="l">Followers</text><text x="376" y="151" class="v" text-anchor="end">1</text></g></svg>